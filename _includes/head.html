<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title | escape }}</title>
{% if page.description %}<meta name="description" content="{{ page.description | strip_newlines | escape }}">{% endif %}
<meta name="robots" content="index,follow,max-image-preview:large">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="{% if page.url contains '/blog/' %}article{% else %}website{% endif %}">
<meta property="og:locale" content="fa_IR">
<meta property="og:site_name" content="تسمه صنعتی بزرگمهر">
<meta property="og:title" content="{{ page.title | default: site.title | escape }}">
{% if page.description %}<meta property="og:description" content="{{ page.description | strip_newlines | escape }}">{% endif %}
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/images/logo.webp' | absolute_url }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title | default: site.title | escape }}">
{% if page.description %}<meta name="twitter:description" content="{{ page.description | strip_newlines | escape }}">{% endif %}
<meta name="twitter:image" content="{{ '/images/logo.webp' | absolute_url }}">
<link rel="icon" href="{{ '/images/favicon.webp' | relative_url }}" type="image/webp">
<link rel="preload" href="{{ '/fonts/Vazirmatn[wght].woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
{{ page.page_extra }}

<script src="{{ '/script.js' | relative_url }}" defer></script>
