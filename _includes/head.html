
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{{ page.title | default: site.title | escape }}</title>

{% if page.description %}
<meta name="description" content="{{ page.description | escape }}">
{% endif %}

<meta name="robots" content="index,follow">
<link rel="canonical" href="{{ site.url }}{{ site.baseurl }}{{ page.url | replace: 'index.html', '' }}">

<link rel="icon" href="{{ '/images/favicon.webp' | relative_url }}" type="image/webp">
<link rel="preload" href="{{ '/fonts/Vazirmatn[wght].woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ '/style.css' | relative_url }}">


{{ page.page_extra }}
