<nav class="breadcrumb" aria-label="مسیر صفحه">
  <a href="{{ '/' | relative_url }}">صفحه اصلی</a>
  <span aria-hidden="true">›</span>
  <a href="{{ include.parent_url | relative_url }}">{{ include.parent_name }}</a>
  <span aria-hidden="true">›</span>
  <span aria-current="page">{{ include.name }}</span>
</nav>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {"@type": "ListItem", "position": 1, "name": "صفحه اصلی", "item": {{ '/' | absolute_url | jsonify }}},
    {"@type": "ListItem", "position": 2, "name": {{ include.parent_name | jsonify }}, "item": {{ include.parent_url | absolute_url | jsonify }}},
    {"@type": "ListItem", "position": 3, "name": {{ include.name | jsonify }}, "item": {{ page.url | absolute_url | jsonify }}}
  ]
}
</script>
